     <!--beneficios do HTML semâmantico
     melhor a acessibilidade (leitores de tela conseguem interpretar melhor)
     melhora o SEO (o google entende melhor a estrutura do site)
     facilita a manutenção do codigo (codigo mais organizado e legivel)
     ajuda no responsividade (tagas semanticas trabalham melhor em CSS E JS )-->

<!--HTML semantico-->

-->
