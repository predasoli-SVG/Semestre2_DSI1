<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Estilo</title>
    <!-- CSS interno 
     ele fica dentro da tag <style> no <head> do HTML-->
        <style>
            h1 {
                color: blue;
            }
            h2{
                color: aqua;
            }
        </style>
</head>
<body>

    <!-- CSS (cascading style sheets) é o que dá forma cor, design ao HTML -->

    <!-- CSS inline -->
     <!-- Definido diretaente na tag HTML, dentro do atributo style -->

     <!-- Quando usar?
      Quando voce precuisar estilizar um único elemento rapidamente (ex:
      testar uam cor diferente em um botão) -->
     <h1 style="font-size: 120px;"> PRIMEIRA AULA CSS</h1>
     <h2 style="font-size: medium;"><strong>subtitulo interno HTML</strong></h2>
     

    

</body>
</html>
